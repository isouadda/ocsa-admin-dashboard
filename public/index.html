<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#15558F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OCSA Admin" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>OCSA Admin Dashboard</title>
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
  <style>body { margin: 0; padding: 0; font-family: -apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing: antialiased; }</style>
  <script>
    // The first frame, before React loads: the stored choice if there is one, otherwise what the
    // computer says. The two colours are the app's own background tokens.
    (function () {
      var DARK_BG = "#0A1628", LIGHT_BG = "#F4F7FB", mode = "dark";
      try {
        var stored = localStorage.getItem("ocsa-theme");
        if (stored === "light" || stored === "dark") mode = stored;
        else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) mode = "light";
      } catch (e) {}
      var bg = mode === "light" ? LIGHT_BG : DARK_BG;
      document.documentElement.style.backgroundColor = bg;
      var paint = function () { if (document.body) document.body.style.backgroundColor = bg; };
      paint();
      document.addEventListener("DOMContentLoaded", paint);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", bg);
      // The language, read the same way: the stored choice, then what the browser says it wants,
      // then English. React sets it again when it loads; this is so the first frame is right.
      var lang = "en";
      try {
        var want = localStorage.getItem("ocsa-lang");
        if (want === "en" || want === "es") lang = want;
        else {
          var list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]) || [];
          for (var i = 0; i < list.length; i += 1) {
            var two = String(list[i] || "").slice(0, 2).toLowerCase();
            if (two === "en" || two === "es") { lang = two; break; }
          }
        }
      } catch (e) {}
      document.documentElement.lang = lang;
    })();
  </script>
</head>
<body><div id="root"></div></body>
</html>
